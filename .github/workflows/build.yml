name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight build irrelevant.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Only the default branch writes the shared cache; PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # One invocation: Gradle configures once and reuses the task graph.
      - name: Test and build
        run: ./gradlew test assembleRelease

      - name: Report APK size
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          size=$(stat -c%s "$apk")
          echo "### APK: $((size / 1024)) KiB" >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$apk" | sort -rn | head -8 >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: earcam-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
