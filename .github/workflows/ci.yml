name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml, which publishes what this builds.
  workflow_call:

# A newer push makes an in-flight run irrelevant. When called from release.yml,
# workflow_ref is the release workflow's and ref the tag, so releases get their own group.
concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 30.0.16248370

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            asset: earcam-linux-x86_64.tar.gz
          - name: Windows
            os: windows-latest
            asset: earcam-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Only the default branch writes the shared cache; PRs read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Includes the end-to-end stream test against a simulated camera on localhost.
      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/earcam.exe "dist/${{ matrix.asset }}"
          else
            tar czf "dist/${{ matrix.asset }}" -C target/release earcam
          fi
          ls -l dist >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v3

      - name: Install NDK and cargo-ndk
        run: |
          sdkmanager --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      - name: Clippy
        run: cargo ndk -t arm64-v8a clippy --all-targets --locked -- -D warnings

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Builds libearcam.so through cargo-ndk and packages it with the NativeActivity.
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Package
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/earcam-android-arm64.apk
          ls -l dist >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: earcam-android-arm64.apk
          path: dist/earcam-android-arm64.apk
          if-no-files-found: error
